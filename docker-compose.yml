services:
  crabberbot:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    image: ghcr.io/enucatl/crabberbot:latest
    cpu_shares: 512
    tmpfs: ["/tmp:rw,noexec,uid=1000,gid=1000,mode=0700,size=256m"]
    networks: [backend, internet]
    environment:
      - RUST_LOG=info,crabberbot=info
      - TELOXIDE_API_URL=http://telegram-bot-api:8081
      - WEBHOOK_URL=https://crabberbot.enucatl.com/webhook
      - TELOXIDE_TOKEN_FILE=/run/secrets/telegram_bot_token
      - DATABASE_URL=postgres://crabberbot@crabberbot-postgres-1:5432/crabberbot
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_MAX_CONNECTIONS=10
      - POSTGRES_MIN_CONNECTIONS=1
      - POSTGRES_ACQUIRE_TIMEOUT_SECS=5
      - DEEPGRAM_API_KEY_FILE=/run/secrets/deepgram_api_key
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
      - DOWNLOADER_SOCKET=/downloader/downloader.sock
      - OPENROUTER_MODEL=inception/mercury-2.5
      - OWNER_CHAT_ID_FILE=/run/secrets/owner_chat_id
    secrets:
      - telegram_bot_token
      - postgres_password
      - deepgram_api_key
      - openrouter_api_key
      - owner_chat_id
    depends_on:
      downloader-worker:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - downloads:/downloads
      - downloader_socket:/downloader:ro

  downloader-worker:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    image: ghcr.io/enucatl/crabberbot-worker:latest
    command: ["./downloader-worker"]
    networks: [downloader]
    environment:
      - RUST_LOG=info,crabberbot=info
      - DOWNLOADER_SOCKET=/downloader/downloader.sock
      - DOWNLOADS_DIR=/downloads
      - AUDIO_CACHE_DIR=/downloads/audio_cache
      - MAX_YT_DLP_SESSIONS=4
      - TMPDIR=/downloads/tmp
      - XDG_CACHE_HOME=/downloads/.cache
    depends_on:
      egress-proxy:
        condition: service_started
    volumes:
      - downloads:/downloads
      - downloader_socket:/downloader

  egress-proxy:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    image: pretix/smokescreen:latest
    command: ["--listen-port", "3128"]
    networks: [downloader, internet]

  cloudflared:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    image: cloudflare/cloudflared:latest
    networks: [backend, internet]
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/tunnel_token
      - TUNNEL_METRICS=127.0.0.1:20241
    secrets: [tunnel_token]
    command: tunnel --no-autoupdate run
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  telegram-bot-api:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-xlarge
    image: ghcr.io/enucatl/telegram-bot-api:latest
    tmpfs: ["/tmp/telegram-bot-api:rw,noexec,uid=101,gid=101,mode=0755,size=2g"]
    volumes: [telegram-bot-api-data:/var/lib/telegram-bot-api]
    networks: [backend, internet]
    environment:
      - TELEGRAM_API_HASH_FILE=/run/secrets/telegram_api_hash
      - TELEGRAM_API_ID_FILE=/run/secrets/telegram_api_id
      - TELEGRAM_LOCAL=1
      - TELEGRAM_VERBOSITY=1
    secrets: [telegram_api_hash, telegram_api_id]

  postgres:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: postgres
    image: postgres:18
    cpu_shares: 1024
    networks: [backend]
    environment:
      POSTGRES_DB: crabberbot
      POSTGRES_USER: crabberbot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crabberbot"]

networks:
  backend:
    internal: true
  downloader:
    internal: true
  internet:

volumes:
  downloads:
  downloader_socket:
  pgdata:
  telegram-bot-api-data:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  postgres_password:
    file: ./secrets/postgres_password
  deepgram_api_key:
    file: ./secrets/deepgram_api_key
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
  owner_chat_id:
    file: ./secrets/owner_chat_id
  telegram_api_hash:
    file: ./secrets/telegram_api_hash
  telegram_api_id:
    file: ./secrets/telegram_api_id
  tunnel_token:
    file: ./secrets/tunnel_token

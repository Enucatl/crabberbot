[package]
name = "crabberbot"
version = "4.2.0"
edition = "2024"
authors = ["enucatl <1423701+Enucatl@users.noreply.github.com>"]
homepage = "https://github.com/Enucatl/crabberbot"
repository = "https://github.com/Enucatl/crabberbot"

[profile.dev]
debug = "line-tables-only"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dashmap = "6.1.0"
indoc = "2"
log = "0.4"
libc = "0.2"
pretty_env_logger = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
teloxide = { git = "https://github.com/teloxide/teloxide.git", default-features = false, features = ["macros", "webhooks", "webhooks-axum", "rustls", "ctrlc_handler"] }
thiserror = "2.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mockall = "0.15"
tempfile = "3"

[patch.crates-io]
# shortcut: Upstream is unmaintained, drop this pin when teloxide removes the dependency.
proc-macro-error2 = { git = "https://github.com/GnomedDev/proc-macro-error-2", rev = "53ff94b61c678593158db1a3d50269c6f0de0db7" }
